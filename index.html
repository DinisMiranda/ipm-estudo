<body>
<title>IPM Estudo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: caderno clínico — índice de temas à esquerda, folha de estudo à direita; flashcards ocupam a folha. */
:root {
  --bg: #f3f5f4;
  --paper: #ffffff;
  --ink: #16201d;
  --muted: #5b6a65;
  --line: #dde3e0;
  --accent: #0e6a63;
  --accent-soft: #e2f0ee;
  --good: #2f7d3a;
  --good-soft: #e5f2e6;
  --warn: #b0561c;
  --warn-soft: #f8e9df;
  --a1: #b23a48; --a2: #2a64a8; --a3: #7a5a12; --a4: #8a3d8f; --a5: #0e6a63;
  --shadow: 0 1px 2px rgba(20,32,29,.06), 0 6px 20px rgba(20,32,29,.06);
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --paper: #172020; --ink: #e6ecea; --muted: #9aaaa5; --line: #2a3634;
    --accent: #5cc1b6; --accent-soft: #1d3331; --good: #7ccc86; --good-soft: #1d3322;
    --warn: #f0a070; --warn-soft: #3a261a;
    --a1: #f08a95; --a2: #8ab4f0; --a3: #e0c06a; --a4: #d59ad9; --a5: #5cc1b6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --paper: #172020; --ink: #e6ecea; --muted: #9aaaa5; --line: #2a3634;
  --accent: #5cc1b6; --accent-soft: #1d3331; --good: #7ccc86; --good-soft: #1d3322;
  --warn: #f0a070; --warn-soft: #3a261a;
  --a1: #f08a95; --a2: #8ab4f0; --a3: #e0c06a; --a4: #d59ad9; --a5: #5cc1b6;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 16px; min-height: 58px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font: 600 22px/1 var(--f-display); letter-spacing: -.01em; }
.brand span { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.modes { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-left: auto; }
.modes button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.navtoggle { display: none; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 14px; }

.wrap {
  max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px;
}
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
.area { margin-bottom: 16px; }
.area h4 { margin: 0 0 6px; font: 600 11px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
.side li a:hover { background: var(--paper); }
.side li a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side li a small { font: 500 11px/1.6 var(--f-mono); color: var(--muted); flex: none; }
.side .empty { color: var(--muted); font-size: 13px; padding: 6px 10px; }

main { min-width: 0; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 4vw, 40px); box-shadow: var(--shadow); }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
h1 { font: 600 clamp(28px, 4.2vw, 40px)/1.1 var(--f-display); letter-spacing: -.015em; margin: 10px 0 16px; text-wrap: balance; }
h2 { font: 600 24px/1.2 var(--f-display); margin: 0 0 12px; text-wrap: balance; }
h3 { font: 600 13px/1.3 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin: 30px 0 10px; }
.essence { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 14px 18px; border-radius: 0 10px 10px 0; font-size: 16px; max-width: 72ch; }
.essence b { display: block; font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.points { margin: 0; padding-left: 20px; max-width: 75ch; display: grid; gap: 6px; }
.points li::marker { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; max-width: 48%; }
.pager a span { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }

/* home */
.lede { color: var(--muted); max-width: 66ch; font-size: 16px; margin: 0 0 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 24px; margin: 4px 0 26px; }
.stat b { display: block; font: 600 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.acard { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.acard h2 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 8px; }
.acard ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
.acard li a { color: var(--ink); text-decoration: none; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed transparent; }
.acard li a:hover { color: var(--accent); }
.acard li small { font: 500 11px/1.8 var(--f-mono); color: var(--muted); }
.meter { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .k { background: var(--good); }
.meter .r { background: var(--warn); }
.howto { margin-top: 26px; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
kbd { font: 500 12px/1 var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px; background: var(--bg); color: var(--ink); }

/* cards */
.deckbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.deckbar select { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 10px; max-width: 100%; min-width: 0; }
.deckbar label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; min-width: 0; flex: 1 1 200px; }
.deckbar .btn { align-self: end; }
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.progress .meter { flex: 1 1 160px; }
.stage { perspective: 1400px; }
.card { position: relative; width: 100%; min-height: 300px; display: block; cursor: pointer; border-radius: 16px; }
.face { position: absolute; inset: 0; border-radius: 16px; padding: clamp(22px, 4vw, 40px); display: flex; flex-direction: column; justify-content: center; gap: 14px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .45s cubic-bezier(.3,.7,.2,1); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: auto; }
.front { background: var(--paper); }
.back { background: var(--accent-soft); transform: rotateY(180deg); }
.card.flipped .front { transform: rotateY(-180deg); }
.card.flipped .back { transform: rotateY(0deg); }
.face .q { font: 600 clamp(20px, 3vw, 27px)/1.3 var(--f-display); text-wrap: balance; }
.face .a { font-size: 17px; line-height: 1.55; max-width: 64ch; }
.face .tag { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.face .hint { font-size: 12px; color: var(--muted); margin-top: auto; }
.status { position: absolute; top: 16px; right: 16px; font: 600 11px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; }
.status.k { background: var(--good-soft); color: var(--good); }
.status.r { background: var(--warn-soft); color: var(--warn); }
.ctrl { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 10px; margin-top: 16px; }
.ctrl .btn { justify-content: center; }
.btn.r { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.btn.r:hover { background: var(--warn-soft); }
.btn.k { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.btn.k:hover { background: var(--good-soft); }
.done { text-align: center; padding: 40px 10px; }
.done p { color: var(--muted); max-width: 46ch; margin: 0 auto 18px; }
.done .actions { justify-content: center; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 40px; }
  .navtoggle { display: inline-block; }
  .side { position: static; max-height: none; display: none; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .side.open { display: block; }
  .modes { margin-left: 0; }
  .top-in { gap: 10px; }
  .brand { margin-right: auto; }
  .ctrl { grid-template-columns: 1fr 1fr; }
  .ctrl .nav { order: 3; }
  .card { min-height: 340px; }
}
@media (prefers-reduced-motion: reduce) { .face { transition: none; } }
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#inicio"><b>IPM Estudo</b><span>Sebenta Chefe 1</span></a>
    <button class="navtoggle" id="navtoggle" aria-expanded="false" aria-controls="side">Temas</button>
    <div class="modes" role="group" aria-label="Modo">
      <button id="m-resumo" aria-pressed="true">Resumo</button>
      <button id="m-cards" aria-pressed="false">Flashcards</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Temas">
    <input class="search" id="q" type="search" placeholder="Procurar tema ou termo (ex. TCD4)" aria-label="Procurar">
    <div id="navlist"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
window.TOPICS = window.TOPICS || [];
window.TOPICS.push(
{
  id: "hiv", area: "Infecciologia", title: "HIV / SIDA",
  essence: "Retrovírus que destrói progressivamente os TCD4. SIDA = TCD4 < 200 ou doença definidora de SIDA. Cada limiar de TCD4 abre a porta a infeções oportunistas específicas.",
  sections: [
    { h: "Vírus e ciclo", points: [
      "Retrovírus de RNA diploide, com cápside e invólucro. Tropismo: TCD4, macrófagos, células dendríticas.",
      "Entrada: gp120 liga ao CD4 + co-recetor (CCR5 na fase inicial → macrófagos/dendríticas; CXCR4 na fase tardia → só TCD4). gp41 faz a fusão.",
      "Transcriptase reversa (RNA→DNA) → integrase (integra no genoma) → protease → saída por gemulação.",
      "Genes: gag (p24, cápside), env (gp120 + gp41), pol (transcriptase reversa, protease, integrase)."
    ]},
    { h: "Fisiopatologia", points: [
      "Primo-infeção (~12 semanas): pico de virémia + queda de TCD4; assintomática ou febre, fadiga, mialgias.",
      "Fase crónica: equilíbrio vírus/TCD4; TCD4 descem lentamente durante anos. TCD8 são as células-chave no combate.",
      "Queda de TCD4: destruição viral direta, lise por TCD8, morte de células não infetadas.",
      "SIDA: TCD4 < 200 (critério laboratorial) OU doença definidora de SIDA (critério clínico)."
    ]},
    { h: "Infeções oportunistas por limiar de TCD4", points: [
      "> 500: Tuberculose pulmonar.",
      "200–500: Sarcoma de Kaposi (HHV-8) — pode surgir em qualquer contagem; o doente já tem SIDA.",
      "< 200: Pneumonia por P. jirovecii; LEMP (vírus JC).",
      "< 100: Toxoplasmose cerebral, Criptococose, Herpes disseminado, Cryptosporidium (diarreia > 1 mês), Candidíase esofágica/brônquica, Linfoma primário do SNC.",
      "< 50: CMV disseminado (retinite, esofagite), Micobactérias não tuberculosas (MAC)."
    ]},
    { h: "Agentes importantes", points: [
      "Toxoplasmose cerebral: reativação; cefaleia, febre, défices focais; TC/RM com MÚLTIPLAS lesões em anel. Tx: Sulfadiazina + Pirimetamina + Leucovorina.",
      "Linfoma primário do SNC (EBV): lesão em anel ÚNICA (vs múltiplas na toxoplasmose).",
      "Meningite criptocócica: cefaleia progressiva, pouca rigidez da nuca, ↑↑ PIC; tinta da China no LCR. Tx: Anfotericina B + Flucitosina → Fluconazol.",
      "P. jirovecii: tosse seca, dispneia; infiltrados bilaterais difusos (\"asas de morcego\"), ↑ β-D-glucano e ↑ LDH. Tx: TMP-SMX.",
      "MAC (< 50): quadro tipo TB, emagrecimento, hepatomegalia. Tx: macrólido + etambutol.",
      "Candidíase: placas brancas que se RASPAM (vs leucoplasia oral pilosa do EBV, que não raspa). Tx: Fluconazol; Anfotericina B se grave.",
      "Herpes simplex: úlceras pequenas múltiplas no esófago médio-distal. Tx: Aciclovir.",
      "CMV: retinite (\"pizza-pie\"), esofagite com úlceras longitudinais, colite, pneumonite. Tx: Ganciclovir EV → Valganciclovir ou Foscarnet.",
      "HHV-8: Sarcoma de Kaposi (pápulas violáceas, neoangiogénese por VEGF), linfoma das serosas, doença de Castleman."
    ]},
    { h: "Tratamento (TARV)", points: [
      "Iniciar TARV logo que se faz o diagnóstico.",
      "Esquema-padrão: 3 fármacos = 2 inibidores nucleosídicos da transcriptase reversa + 1 de outra classe (inibidor da integrase \"-gravir\", da protease \"-navir\" ou não nucleosídico como Efavirenz).",
      "Única dupla terapia: Dolutegravir + Lamivudina (3TC). Lamivudina também atua na hepatite B (suspender pode agravar HBV).",
      "Abacavir: pesquisar HLA-B*5701 antes (contraindicação).",
      "TDF tem mais toxicidade renal e óssea do que TAF.",
      "Ritonavir e Cobicistate inibem CYP3A4 → potenciadores (usados com Darunavir, Atazanavir, Elvitegravir).",
      "Outros: Maraviroc (anti-CCR5), Enfuvirtida (fusão), Ibalizumab, Fostemsavir, Lenacapavir (cápside).",
      "IRIS: iniciar TARV 2 semanas após tratar infeção ativa (ex. TB); 4 semanas se envolve SNC (meningite TB ou criptocócica)."
    ]},
    { h: "Profilaxias", points: [
      "TCD4 < 200 → TMP-SMX (P. jirovecii).",
      "TCD4 < 100 → profilaxia para Toxoplasmose.",
      "TCD4 < 50 → Azitromicina (MAC)."
    ]}
  ],
  cards: [
    ["Que critérios definem SIDA?", "TCD4 < 200 células/µL (laboratorial) OU presença de uma doença definidora de SIDA (clínico)."],
    ["Que co-recetor usa o HIV na fase inicial e na tardia?", "Inicial: CCR5 (macrófagos e células dendríticas). Tardia: CXCR4 (exclusivo dos TCD4)."],
    ["Que proteína do HIV se liga ao CD4? E qual faz a fusão?", "gp120 liga-se ao CD4; gp41 faz a fusão da membrana."],
    ["Abaixo de que TCD4 surge a pneumonia por P. jirovecii?", "< 200 TCD4."],
    ["Toxoplasmose cerebral vs Linfoma primário do SNC na imagem?", "Toxoplasmose: múltiplas lesões em anel. Linfoma primário do SNC (EBV): lesão em anel única."],
    ["Tratamento da toxoplasmose cerebral?", "Sulfadiazina + Pirimetamina + Leucovorina (ácido folínico)."],
    ["Como se diagnostica a meningite criptocócica e como se trata?", "Tinta da China no LCR (mostra a cápsula). Indução com Anfotericina B + Flucitosina, manutenção com Fluconazol."],
    ["Achados típicos da pneumonia por P. jirovecii?", "Infiltrados bilaterais difusos (asas de morcego), ↑ β-D-glucano e ↑ LDH. Tratamento com TMP-SMX."],
    ["Como distinguir candidíase oral de leucoplasia oral pilosa?", "Candidíase: placas brancas que se raspam. Leucoplasia oral pilosa (EBV): não raspa."],
    ["Lesões esofágicas: CMV vs Herpes simplex?", "CMV: úlceras longitudinais. HSV: múltiplas úlceras pequenas no esófago médio-distal."],
    ["Retinite em \"pizza-pie\" com TCD4 < 50?", "CMV. Tratamento: Ganciclovir EV → Valganciclovir ou Foscarnet."],
    ["Que vírus causa o Sarcoma de Kaposi e em que contagem de TCD4 aparece?", "HHV-8. Pode surgir em qualquer contagem (tipicamente 200–500); o doente já tem SIDA."],
    ["Esquema habitual de TARV?", "2 inibidores nucleosídicos da transcriptase reversa + 1 fármaco de outra classe (normalmente inibidor da integrase)."],
    ["Qual a única dupla terapia possível na TARV?", "Dolutegravir + Lamivudina (3TC)."],
    ["Que teste fazer antes de dar Abacavir?", "Pesquisar HLA-B*5701 (se positivo, contraindicado)."],
    ["Porque se usa Ritonavir ou Cobicistate em baixa dose?", "Inibem a CYP3A4 e potenciam outros fármacos (Darunavir, Atazanavir, Elvitegravir)."],
    ["Quando iniciar TARV num doente com TB? E com meningite criptocócica?", "TB: 2 semanas após início do tratamento. Atingimento do SNC: 4 semanas. Objetivo: evitar IRIS."],
    ["Profilaxias primárias por limiar de TCD4?", "< 200: TMP-SMX (P. jirovecii). < 100: Toxoplasmose. < 50: Azitromicina (MAC)."],
    ["Tratamento das micobactérias não tuberculosas (MAC)?", "Macrólido + Etambutol."]
  ]
},
{
  id: "zoonoses", area: "Infecciologia", title: "Zoonoses",
  essence: "Cinco agentes, cinco histórias clínicas: Borrelia (caminhada na floresta, carraça), Leptospira (água doce, surf nos trópicos), Brucella (leite não pasteurizado, agricultor), Rickettsia (carraça, escara negra) e Coxiella (veterinário, aerossóis). A Doxiciclina é a base de quase todos.",
  sections: [
    { h: "LCR — como ler", points: [
      "Viral (claro): < 500 células, proteínas < 1 g/L, glicose normal.",
      "Bacteriano (purulento): > 500 células, proteínas > 1 g/L, glicose diminuída.",
      "Borrelia: ↑ mononucleares e ↑ proteínas.",
      "Meningite crónica: ≥ 4 semanas de sintomas, muitas vezes sem febre."
    ]},
    { h: "Borrelia — Doença de Lyme", points: [
      "Espiroqueta; Giemsa/Wright; meio BSK. Vetor: carraça Ixodes ricinus. Incubação ~14 dias.",

      "Murphy vesicular: o doente PARA a inspiração por dor ao palpar o hipocôndrio direito → colecistite aguda.",
      "Baço: da fossa ilíaca direita para o hipocôndrio esquerdo; decúbito lateral direito. Bordos palpáveis = baço (o rim não tem).",
      "Rim: retroperitoneal, mantém timpanismo anterior, não move com a respiração. Murphy renal: dor à percussão do ângulo costovertebral (pielonefrite, cólica).",
      "Massa pulsátil e expansível periumbilical: aneurisma da aorta."
    ]},
    { h: "Apendicite", points: [
      "Ponto de McBurney: 1/3 da distância entre a espinha ilíaca anterossuperior e o umbigo.",
      "Rovsing: dor na FID ao palpar a FIE.",
      "Psoas: dor à extensão da coxa direita (apêndice retrocecal).",
      "Obturador: dor à rotação interna da anca (apêndice pélvico)."
    ]}
  ],
  cards: [
    ["Ordem do exame abdominal?", "Inspeção → auscultação → percussão → palpação (auscultar antes de manipular o intestino)."],
    ["Dor visceral vs somática?", "Visceral: mal localizada, linha média (distensão, isquemia). Somática: bem localizada sobre o órgão (peritoneu parietal)."],
    ["Porque migra a dor da apendicite?", "Começa visceral (periumbilical, intestino médio) e passa a somática na FID quando inflama o peritoneu parietal."],
    ["Úlcera gástrica vs duodenal pela relação com as refeições?", "Gástrica: piora ~30 min após comer. Duodenal: 2–3 h depois/noturna, alivia ao comer."],
    ["Sinal de Cullen vs Grey-Turner?", "Cullen: equimose periumbilical (hemorragia intra-abdominal). Grey-Turner: equimose nos flancos (retroperitoneal, pancreatite)."],
    ["Quando se considera silêncio abdominal?", "Ausência de ruídos durante 20 segundos."],
    ["Sinal de Murphy vesicular positivo?", "Interrupção da inspiração por dor à palpação do hipocôndrio direito; colecistite aguda."],
    ["Sinais de irritação peritoneal?", "Defesa, Blumberg (dor à descompressão), dor à percussão e à tosse, ↓ movimentos respiratórios."],
    ["Ponto de McBurney?", "A 1/3 da distância da espinha ilíaca anterossuperior direita ao umbigo."],
    ["Sinal de Rovsing?", "Dor na fossa ilíaca direita ao palpar a esquerda (apendicite)."],
    ["Sinal do psoas e do obturador?", "Psoas: dor à extensão da coxa (apêndice retrocecal). Obturador: dor à rotação interna da anca (apêndice pélvico)."],
    ["Como distinguir baço aumentado de rim esquerdo?", "Baço: bordos palpáveis, macicez, move com a respiração. Rim: retroperitoneal, timpanismo anterior mantido, não move."],
    ["Melhor sinal para ascite (sensível vs específico)?", "Macicez móvel (mais sensível); onda líquida (mais específica)."],
    ["Hepatimetria normal?", "Até cerca de 10 cm na linha médio-clavicular."],
    ["Murphy renal?", "Dor à percussão do ângulo costovertebral: pielonefrite ou cólica renal."]
  ]
},
{
  id: "locomotor", area: "Sintomas e Semiologia", title: "Semiologia do Sistema Locomotor",
  essence: "Ordem: inspeção → palpação → mobilidade → estabilidade, deixando o doloroso para o fim e o Rx para depois do exame. O padrão temporal da dor orienta (manhã = inflamatória; fim do dia = mecânica). Cada articulação tem o seu teste-chave.",
  sections: [
    { h: "História", points: [
      "Profissão concreta (a tarefa, não só \"operário\").",
      "Dor pior de manhã: reumática/inflamatória. A meio do dia: tendinite. Ao longo do dia: artrose.",
      "Dor óssea: profunda, não relacionada com o movimento. Articular: piora com o movimento.",
      "Fraqueza proximal: miopatia. Distal: neuropatia. Miastenia: fraqueza generalizada + diplopia + disfagia.",
      "Atrofia muscular depende do TEMPO, não da gravidade → data a lesão.",
      "Mobilidade ativa ↓ com passiva normal: problema musculotendinoso/neurológico. Passiva ↓: bloqueio articular."
    ]},
    { h: "Inspeção", points: [
      "Escoliose: mais em mulheres, região dorsal.",
      "Genu varo (mais artrose) vs genu valgo.",
      "Hallux valgus (joanete). Anquilose. Pé plano valgo, pé cavo.",
      "Marcha em rotação interna na criança: anteversão do colo do fémur, corrige com o crescimento.",
      "Bursite pré-patelar: diagnóstico só à inspeção.",
      "Comprimento dos membros: umbigo ou EIAS → maléolo interno.",
      "Crianças 1–3 anos: examinar ao colo dos pais, marquesa por último."
    ]},
    { h: "Testes por região", points: [
      "Canal cárpico (nervo mediano; 1.º–4.º dedos, poupa o 5.º): sinais de Tinel e Phalen.",
      "De Quervain (longo abdutor e curto extensor do polegar): teste de Finkelstein.",
      "Fratura dos dedos: imobilizar em flexão com os dedos a apontar para o tubérculo do escafoide.",
      "Ligamento cruzado anterior: Lachman (mais sensível), gaveta anterior (≥ 2 cm); RM é o melhor exame.",
      "Choque da rótula: derrame articular. Quisto de Baker: fossa poplítea.",
      "Tendão de Aquiles: teste de Thompson (apertar a perna → sem flexão plantar = rotura).",
      "Anca: perde-se primeiro a rotação (interna/externa), depois adução/abdução, depois flexão (artrose). Sinal de Trendelenburg (glúteo médio).",
      "Lasègue: dor ciática à elevação da perna estendida (hérnia discal).",
      "Epicondilite lateral (tenista) vs medial (golfista).",
      "Síndrome de Volkmann: isquemia do antebraço após fratura supracondiliana do úmero (artéria braquial) → dedos em flexão; urgência.",
      "Gota: homens; 1.ª metatarsofalângica (podagra); dor que acorda à noite."
    ]}
  ],
  cards: [
    ["Ordem do exame do sistema locomotor?", "Inspeção → palpação → mobilidade → estabilidade (doloroso no fim; Rx depois do exame)."],
    ["Dor articular pior de manhã vs ao fim do dia?", "Manhã: inflamatória (reumática). Fim do dia: mecânica (artrose)."],
    ["Fraqueza proximal vs distal?", "Proximal: miopatia. Distal: neuropatia."],
    ["Mobilidade ativa alterada com passiva normal significa?", "Problema musculotendinoso ou neurológico (não articular)."],
    ["Sinais do síndrome do canal cárpico?", "Tinel (percussão do mediano) e Phalen (flexão dos punhos 1 min); parestesias do 1.º ao 4.º dedo."],
    ["Teste de Finkelstein?", "Tenossinovite de De Quervain (longo abdutor e curto extensor do polegar)."],
    ["Teste mais sensível para rotura do LCA?", "Teste de Lachman (RM confirma)."],
    ["Teste de Thompson?", "Apertar a barriga da perna: ausência de flexão plantar indica rotura do tendão de Aquiles."],
    ["Manobra de Lasègue positiva?", "Dor ciática à elevação da perna estendida: compressão radicular (hérnia discal)."],
    ["Primeiro movimento perdido na artrose da anca?", "Rotação (interna/externa), depois adução/abdução, depois flexão."],
    ["Síndrome de Volkmann?", "Isquemia do compartimento anterior do antebraço (artéria braquial) após fratura do úmero; dedos em flexão fixa; urgência."],
    ["Podagra?", "Artrite aguda da 1.ª metatarsofalângica: crise de gota."],
    ["Para que serve o choque da rótula?", "Detetar derrame articular do joelho."],
    ["Atrofia muscular indica o quê?", "O tempo de evolução da lesão (não a gravidade)."]
  ]
}
);

</script>
<script>
(function () {
  var T = window.TOPICS;
  var AREAS = [
    { name: "Infecciologia", color: "var(--a1)" },
    { name: "Pneumologia", color: "var(--a2)" },
    { name: "Saúde Pública", color: "var(--a3)" },
    { name: "Cardiovascular", color: "var(--a4)" },
    { name: "Sintomas e Semiologia", color: "var(--a5)" }
  ];
  var areaColor = {}; AREAS.forEach(function (a) { areaColor[a.name] = a.color; });
  var byId = {}; T.forEach(function (t) { byId[t.id] = t; });
  var ordered = [];
  AREAS.forEach(function (a) { T.forEach(function (t) { if (t.area === a.name) ordered.push(t); }); });

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function slug(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }

  // progress store (per viewer)
  var KEY = "ipm-flash-v1";
  var prog = {};
  try { prog = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { prog = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
  function ck(tid, i) { return tid + ":" + i; }

  var allCards = [];
  ordered.forEach(function (t) { t.cards.forEach(function (c, i) { allCards.push({ tid: t.id, i: i, q: c[0], a: c[1] }); }); });

  function counts(list) {
    var k = 0, r = 0;
    list.forEach(function (c) { var v = prog[ck(c.tid, c.i)]; if (v === 1) k++; else if (v === -1) r++; });
    return { k: k, r: r, n: list.length };
  }
  function cardsOf(scope) {
    if (scope === "todos") return allCards.slice();
    if (scope.indexOf("area-") === 0) {
      var an = AREAS.filter(function (a) { return "area-" + slug(a.name) === scope; })[0];
      return allCards.filter(function (c) { return an && byId[c.tid].area === an.name; });
    }
    return allCards.filter(function (c) { return c.tid === scope; });
  }
  function meter(c) {
    var n = c.n || 1;
    return '<div class="meter" aria-hidden="true"><i class="k" style="width:' + (c.k / n * 100) + '%"></i><i class="r" style="width:' + (c.r / n * 100) + '%"></i></div>';
  }

  var mode = "resumo"; // resumo | cards
  var current = null; // topic id or null (home)
  var deck = { scope: "todos", filter: "todos", order: [], idx: 0, flipped: false };

  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var navlist = document.getElementById("navlist");
  var q = document.getElementById("q");

  function topicText(t) {
    var s = t.title + " " + t.essence;
    t.sections.forEach(function (x) { s += " " + x.h + " " + x.points.join(" "); });
    t.cards.forEach(function (c) { s += " " + c[0] + " " + c[1]; });
    return s.toLowerCase();
  }
  var searchIdx = {}; T.forEach(function (t) { searchIdx[t.id] = topicText(t); });

  function renderNav() {
    var term = q.value.trim().toLowerCase();
    var html = "";
    var any = false;
    AREAS.forEach(function (a) {
      var items = ordered.filter(function (t) { return t.area === a.name && (!term || searchIdx[t.id].indexOf(term) !== -1); });
      if (!items.length) return;
      any = true;
      html += '<div class="area"><h4><span class="dot" style="background:' + a.color + '"></span>' + esc(a.name) + '</h4><ul>';
      items.forEach(function (t) {
        var cur = (mode === "resumo" && current === t.id) || (mode === "cards" && deck.scope === t.id);
        html += '<li><a href="#' + t.id + '" data-id="' + t.id + '"' + (cur ? ' aria-current="true"' : "") + '>' + esc(t.title) + '<small>' + t.cards.length + '</small></a></li>';
      });
      html += "</ul></div>";
    });
    if (!any) html = '<p class="empty">Nenhum tema contém “' + esc(term) + '”.</p>';
    navlist.innerHTML = html;
  }

  function renderHome() {
    var c = counts(allCards);
    var html = '<section class="sheet"><span class="eyebrow">Introdução à Prática Médica</span>' +
      '<h1>A sebenta inteira, desmontada em ' + T.length + ' temas</h1>' +
      '<p class="lede">Cada tema tem um parágrafo com o essencial, os pontos-chave organizados por secção e um baralho de flashcards. Começa pelo resumo de um tema e testa-te logo a seguir.</p>' +
      '<div class="stats"><div class="stat"><b>' + T.length + '</b><span>Temas</span></div><div class="stat"><b>' + allCards.length + '</b><span>Flashcards</span></div>' +
      '<div class="stat"><b>' + c.k + '</b><span>Já sabes</span></div><div class="stat"><b>' + c.r + '</b><span>Para rever</span></div></div>' +
      '<div class="areas">';
    AREAS.forEach(function (a) {
      var items = ordered.filter(function (t) { return t.area === a.name; });
      var ac = counts(cardsOf("area-" + slug(a.name)));
      html += '<div class="acard"><h2><span class="dot" style="background:' + a.color + '"></span>' + esc(a.name) + '</h2>' + meter(ac) + '<ul>';
      items.forEach(function (t) { html += '<li><a href="#' + t.id + '">' + esc(t.title) + '<small>' + t.cards.length + '</small></a></li>'; });
      html += '</ul><button class="btn" data-study="area-' + slug(a.name) + '">Treinar ' + ac.n + ' cartões</button></div>';
    });
    html += '</div><div class="actions"><button class="btn primary" data-study="todos">Treinar todos os cartões</button></div>' +
      '<div class="howto"><span>Nos flashcards: <kbd>Espaço</kbd> vira o cartão, <kbd>1</kbd> marca para rever, <kbd>2</kbd> marca como sabido, <kbd>←</kbd> <kbd>→</kbd> navegam.</span>' +
      '<span>O progresso fica guardado neste browser.</span></div></section>';
    main.innerHTML = html;
  }

  function renderTopic(t) {
    var pos = ordered.indexOf(t);
    var prev = ordered[pos - 1], next = ordered[pos + 1];
    var c = counts(cardsOf(t.id));
    var html = '<article class="sheet"><span class="eyebrow"><span class="dot" style="background:' + areaColor[t.area] + '"></span>' + esc(t.area) + '</span>' +
      '<h1>' + esc(t.title) + '</h1>' +
      '<div class="essence"><b>Em 30 segundos</b>' + esc(t.essence) + '</div>';
    t.sections.forEach(function (s) {
      html += '<h3>' + esc(s.h) + '</h3><ul class="points">' + s.points.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + '</ul>';
    });
    html += '<div class="actions"><button class="btn primary" data-study="' + t.id + '">Treinar os ' + t.cards.length + ' cartões deste tema</button>' +
      (c.r ? '<button class="btn r" data-study="' + t.id + '" data-filter="rever">Rever só os ' + c.r + ' que falhaste</button>' : '') + '</div>' +
      '<nav class="pager" aria-label="Temas vizinhos">' +
      (prev ? '<a href="#' + prev.id + '"><span>Anterior</span>← ' + esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a href="#' + next.id + '" style="text-align:right"><span>Seguinte</span>' + esc(next.title) + ' →</a>' : '<span></span>') +
      '</nav></article>';
    main.innerHTML = html;
  }

  function buildDeck(keepIdx) {
    var list = cardsOf(deck.scope);
    if (deck.filter === "rever") list = list.filter(function (c) { return prog[ck(c.tid, c.i)] === -1; });
    else if (deck.filter === "novos") list = list.filter(function (c) { return prog[ck(c.tid, c.i)] === undefined; });
    else if (deck.filter === "naosabidos") list = list.filter(function (c) { return prog[ck(c.tid, c.i)] !== 1; });
    deck.order = list;
    if (!keepIdx) deck.idx = 0;
    deck.flipped = false;
  }
  function shuffle() {
    var a = deck.order;
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    deck.idx = 0; deck.flipped = false;
  }

  function scopeOptions() {
    var o = '<option value="todos"' + (deck.scope === "todos" ? " selected" : "") + '>Todos os temas (' + allCards.length + ')</option><optgroup label="Por área">';
    AREAS.forEach(function (a) { var v = "area-" + slug(a.name); o += '<option value="' + v + '"' + (deck.scope === v ? " selected" : "") + '>' + esc(a.name) + ' (' + cardsOf(v).length + ')</option>'; });
    o += '</optgroup>';
    AREAS.forEach(function (a) {
      o += '<optgroup label="' + esc(a.name) + '">';
      ordered.forEach(function (t) { if (t.area === a.name) o += '<option value="' + t.id + '"' + (deck.scope === t.id ? " selected" : "") + '>' + esc(t.title) + ' (' + t.cards.length + ')</option>'; });
      o += '</optgroup>';
    });
    return o;
  }

  function renderCards() {
    var full = cardsOf(deck.scope);
    var c = counts(full);
    var html = '<section class="sheet"><div class="deckbar">' +
      '<label>Baralho<select id="scope">' + scopeOptions() + '</select></label>' +
      '<label>Mostrar<select id="filter">' +
      ['todos:Todos os cartões', 'naosabidos:Ainda não sabidos', 'rever:Só os que falhei', 'novos:Nunca vistos'].map(function (x) { var p = x.split(":"); return '<option value="' + p[0] + '"' + (deck.filter === p[0] ? " selected" : "") + '>' + p[1] + '</option>'; }).join("") +
      '</select></label><button class="btn" id="shuffle">Baralhar</button></div>' +
      '<div class="progress">' + meter(c) + '<span>' + c.k + ' sabidos · ' + c.r + ' a rever · ' + (c.n - c.k - c.r) + ' por ver</span></div>';
    if (!deck.order.length) {
      html += '<div class="done"><h2>' + (deck.filter === "rever" ? "Nada para rever aqui" : "Não há cartões neste filtro") + '</h2><p>Muda o filtro ou escolhe outro baralho.</p>' +
        '<div class="actions"><button class="btn primary" id="showall">Ver todos os cartões deste baralho</button></div></div>';
    } else if (deck.idx >= deck.order.length) {
      var rc = counts(deck.order);
      html += '<div class="done"><h2>Baralho terminado</h2><p>' + rc.k + ' de ' + rc.n + ' marcados como sabidos' + (rc.r ? ' e ' + rc.r + ' para rever.' : '.') + '</p>' +
        '<div class="actions">' + (rc.r ? '<button class="btn r" id="again-r">Repetir os ' + rc.r + ' a rever</button>' : '') +
        '<button class="btn primary" id="again">Recomeçar baralhado</button></div></div>';
    } else {
      var cur = deck.order[deck.idx];
      var t = byId[cur.tid];
      var st = prog[ck(cur.tid, cur.i)];
      var badge = st === 1 ? '<span class="status k">Sabido</span>' : st === -1 ? '<span class="status r">A rever</span>' : '';
      html += '<div class="stage"><div class="card' + (deck.flipped ? " flipped" : "") + '" id="card" role="button" tabindex="0" aria-label="Cartão: toca para virar">' +
        '<div class="face front">' + badge + '<span class="tag"><span class="dot" style="background:' + areaColor[t.area] + '"></span>' + esc(t.title) + ' · ' + (deck.idx + 1) + ' / ' + deck.order.length + '</span>' +
        '<div class="q">' + esc(cur.q) + '</div><div class="hint">Toca para ver a resposta</div></div>' +
        '<div class="face back"><span class="tag">Resposta</span><div class="a">' + esc(cur.a) + '</div><div class="hint">Sabias? Marca em baixo.</div></div>' +
        '</div></div>' +
        '<div class="ctrl"><button class="btn nav" id="prev" aria-label="Cartão anterior"' + (deck.idx === 0 ? " disabled" : "") + '>←</button>' +
        '<button class="btn r" id="mark-r">Rever <kbd>1</kbd></button><button class="btn k" id="mark-k">Sabia <kbd>2</kbd></button>' +
        '<button class="btn nav" id="next" aria-label="Cartão seguinte">→</button></div>';
    }
    html += '</section>';
    main.innerHTML = html;
    var card = document.getElementById("card");
    if (card) card.addEventListener("click", flip);
    bind("prev", function () { go(-1); });
    bind("next", function () { go(1); });
    bind("mark-r", function () { mark(-1); });
    bind("mark-k", function () { mark(1); });
    bind("shuffle", function () { buildDeck(); shuffle(); renderCards(); });
    bind("showall", function () { deck.filter = "todos"; buildDeck(); renderCards(); });
    bind("again", function () { buildDeck(); shuffle(); renderCards(); });
    bind("again-r", function () { deck.filter = "rever"; buildDeck(); shuffle(); renderCards(); });
    var sc = document.getElementById("scope");
    if (sc) sc.addEventListener("change", function () { deck.scope = sc.value; buildDeck(); renderNav(); renderCards(); });
    var fl = document.getElementById("filter");
    if (fl) fl.addEventListener("change", function () { deck.filter = fl.value; buildDeck(); renderCards(); });
  }
  function bind(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", fn); }
  function flip() { deck.flipped = !deck.flipped; var card = document.getElementById("card"); if (card) card.classList.toggle("flipped", deck.flipped); }
  function go(d) {
    var n = deck.idx + d;
    if (n < 0) return;
    deck.idx = Math.min(n, deck.order.length); deck.flipped = false; renderCards();
  }
  function mark(v) {
    var cur = deck.order[deck.idx]; if (!cur) return;
    prog[ck(cur.tid, cur.i)] = v; save();
    deck.idx++; deck.flipped = false; renderCards();
  }

  function setMode(m) {
    mode = m;
    document.getElementById("m-resumo").setAttribute("aria-pressed", m === "resumo");
    document.getElementById("m-cards").setAttribute("aria-pressed", m === "cards");
    render();
  }
  function render() {
    renderNav();
    if (mode === "cards") renderCards();
    else if (current && byId[current]) renderTopic(byId[current]);
    else renderHome();
    window.scrollTo(0, 0);
  }
  function study(scope, filter) {
    deck.scope = scope; deck.filter = filter || "todos"; buildDeck();
    if (filter === "rever" || scope === "todos" || scope.indexOf("area-") === 0) shuffle();
    setMode("cards");
  }

  function fromHash() {
    var h = (location.hash || "").slice(1);
    if (h === "treino") { if (!deck.order.length) buildDeck(); setMode("cards"); return; }
    current = byId[h] ? h : null;
    if (mode === "cards" && current) { mode = "resumo"; }
    setMode(mode === "cards" ? "cards" : "resumo");
  }

  document.getElementById("m-resumo").addEventListener("click", function () { if (location.hash === "#treino") history.replaceState(null, "", current ? "#" + current : "#inicio"); setMode("resumo"); });
  document.getElementById("m-cards").addEventListener("click", function () {
    if (current && deck.scope === "todos" && !deck.order.length) deck.scope = current;
    if (!deck.order.length) buildDeck();
    setMode("cards");
  });
  main.addEventListener("click", function (e) {
    var b = e.target.closest("[data-study]");
    if (b) { study(b.getAttribute("data-study"), b.getAttribute("data-filter")); }
  });
  navlist.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-id]");
    if (!a) return;
    side.classList.remove("open"); document.getElementById("navtoggle").setAttribute("aria-expanded", "false");
    if (mode === "cards") { e.preventDefault(); deck.scope = a.getAttribute("data-id"); deck.filter = "todos"; buildDeck(); render(); }
  });
  q.addEventListener("input", renderNav);
  document.getElementById("navtoggle").addEventListener("click", function () {
    var open = side.classList.toggle("open"); this.setAttribute("aria-expanded", open);
  });
  window.addEventListener("hashchange", function () { mode = "resumo"; fromHash(); });
  document.addEventListener("keydown", function (e) {
    if (mode !== "cards") return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (tag === "button" && (e.key === " " || e.key === "Enter")) return;
    if (e.key === " " || e.key === "Enter") { if (document.getElementById("card")) { e.preventDefault(); flip(); } }
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "1") mark(-1);
    else if (e.key === "2") mark(1);
  });

  buildDeck();
  fromHash();
})();
</script>

</body>
</html>
